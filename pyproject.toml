[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whisperapp"
version = "1.1.0"
description = "Local speech transcription with speaker diarization — web UI, system tray, CLI and REST API"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "James Davies", email = "james@handleport.com"},
]
keywords = [
    "whisper", "transcription", "speech-to-text", "diarization",
    "speaker-diarization", "audio", "mlx", "whisperx",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: Web Environment",
    "Environment :: No Input/Output (Daemon)",
]
dependencies = [
    # Core transcription — works on all platforms (CPU + CUDA on Windows/Linux,
    # CPU with int8 on Mac, MPS for diarization on Apple Silicon)
    "whisperx",
    "pyannote.audio",
    # Apple Silicon fast path — only installs on arm64 macOS.
    # Uses Apple MLX framework (Neural Engine + GPU) for Whisper inference.
    # pip/uv skips this automatically on Windows, Linux, and Intel Mac.
    "mlx-whisper; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # API server and CLI
    "fastapi",
    "uvicorn[standard]",
    "bleach",
    "httpx",
    "click",
    "requests",
    "soundfile",
    "psutil",
    "mutagen",
    # Acoustic analysis (volume / pitch / speaking-rate markers in transcripts).
    # Pure DSP — no AI provider needed.
    "librosa",
    # DOCX and PDF output formats with template support.
    "python-docx",
    "weasyprint",
    "pyobjc-framework-AVFoundation; sys_platform == 'darwin'",
    # Windows: route SSL through the Windows certificate store so corporate
    # proxies / AV TLS inspectors (Norton, ZScaler, etc.) work without manual
    # certifi tweaks.
    "truststore; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/jlldavies/whisperapp"
Repository = "https://github.com/jlldavies/whisperapp"
"Bug Tracker" = "https://github.com/jlldavies/whisperapp/issues"

[project.optional-dependencies]
# Desktop app extras — tray icon, mic recording, browser launch.
# Not needed for headless / Docker / server deployments.
desktop = [
    "pystray",
    "Pillow",
    "sounddevice",  # ships portaudio prebuilt on all platforms; replaces pyaudio
]
# AI provider SDKs — install only what you need
claude = ["anthropic>=0.25"]
openai = ["openai>=1.0"]
# Ollama uses requests (already a core dependency) — no extra package needed
# Convenience bundles
ai-all = ["anthropic>=0.25", "openai>=1.0"]
# Development — includes desktop extras so the tray works during local dev
dev = ["pytest", "pytest-asyncio", "pytest-playwright", "whisperapp[desktop]"]
build = ["pyinstaller>=6.0"]

[project.scripts]
# CLI — runs headless, talks to a running daemon via REST
whisperapp = "whisperapp.cli:main"

[project.gui-scripts]
# Full app with tray icon (no console window on Windows)
whisperapp-app = "whisperapp.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["whisperapp*"]

[tool.setuptools.package-data]
whisperapp = [
    "static/**/*",
    "templates/**/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "browser: browser-driven tests via Playwright (require live app on ports 7860/7861)",
    "integration: integration tests that download models or need HF_TOKEN",
]
