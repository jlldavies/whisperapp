name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            portaudio19-dev \
            ffmpeg \
            libgomp1 \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libfontconfig1 \
            fonts-liberation

      - name: Install CPU-only PyTorch
        run: |
          pip install torch==2.1.2+cpu torchaudio==2.1.2+cpu \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install whisperapp
        run: pip install -e ".[desktop,dev]"

      - name: Run tests
        run: python -m pytest tests/ -m "not browser and not integration" -q

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t whisperapp:ci .

      - name: Push to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag whisperapp:ci ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          docker tag whisperapp:ci ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          docker push ghcr.io/${{ github.repository }}:latest
