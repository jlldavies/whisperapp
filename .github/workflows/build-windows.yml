name: Build Windows installer

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install launcher dependencies (no torch/whisperx)
        run: pip install ".[desktop]" pyinstaller

      - name: Build .exe bundle
        run: pyinstaller whisperapp.spec --clean --noconfirm

      - name: Set version from tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=dev" >> $GITHUB_OUTPUT
          fi

      - name: Build Inno Setup installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.4
        with:
          path: installer/windows.iss
          options: /DAppVersion=${{ steps.version.outputs.version }}

      - name: Upload installer to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/WhisperApp-${{ steps.version.outputs.version }}-setup.exe

      - name: Upload installer as artifact (non-release runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: WhisperApp-windows
          path: installer/Output/*.exe
          retention-days: 7
