services:
  whisperapp:
    build: .
    image: whisperapp:latest
    ports:
      - "7861:7861"
    environment:
      # Required for speaker diarization — free HuggingFace account
      HF_TOKEN: ${HF_TOKEN}
      # Optional — override defaults
      # WHISPERAPP_OUTPUT_PATH: /data
      # Webhook security — comma-separated hosts, or * for any; default loopback only
      # WHISPERAPP_WEBHOOK_ALLOWED_HOSTS: "*"
      # WHISPERAPP_WEBHOOK_SECRET: your-secret-here
      # API key auth for non-loopback access (required when exposing beyond localhost)
      # WHISPERAPP_API_KEY: your-api-key-here
    volumes:
      # Model weights — persisted so they survive container restarts
      - whisperapp-models:/root/.cache
      # Transcript output — mount a host path to retrieve files directly
      - whisperapp-output:/data
      # Config — persists HF token, model preferences, template paths
      - whisperapp-config:/root/.whisperapp
    restart: unless-stopped
    # For NVIDIA GPU acceleration, uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  whisperapp-models:
  whisperapp-output:
  whisperapp-config:
